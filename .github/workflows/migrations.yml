name: Migraciones

# Aplica las migraciones de supabase/migrations al proyecto remoto.
# - staging: automáticamente al fusionar en main.
# - production: manual (Actions › Migraciones › Run workflow) y protegido por el
#   environment "production" (configurar revisores obligatorios en GitHub).
# Secretos por environment: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Entorno
        type: choice
        options: [staging, production]
        default: staging

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Omitir si el entorno no está configurado
        id: check
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Secretos de Supabase no configurados para este entorno; se omite." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: steps.check.outputs.skip != 'true'
        name: Migraciones pendientes
        run: pnpm exec supabase migration list
      - if: steps.check.outputs.skip != 'true'
        run: pnpm exec supabase db push
