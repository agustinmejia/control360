<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de inventario</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2EF;--card:#fff;--ink:#16231F;--mut:#5C6B65;--line:#D6DFDA;--in:#157A5B;--out:#C2410C;--cr:#6D3FD1;--btn:#16231F;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101815;--card:#18231F;--ink:#E8F0EC;--mut:#93A39C;--line:#2A3A34;--in:#3FC59A;--out:#FB923C;--cr:#A78BFA;--btn:#E8F0EC;--btnt:#101815}}
:root[data-theme="dark"]{--bg:#101815;--card:#18231F;--ink:#E8F0EC;--mut:#93A39C;--line:#2A3A34;--in:#3FC59A;--out:#FB923C;--cr:#A78BFA;--btn:#E8F0EC;--btnt:#101815}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 'Bricolage Grotesque',system-ui,sans-serif;padding-bottom:84px}
header{padding:18px 16px 4px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--mut);letter-spacing:0}
main{padding:12px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:17px;font-weight:600}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:600 16px inherit;font-family:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--btn);color:var(--btnt);width:100%;margin-top:12px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg label{flex:1 1 28%;margin:0;color:var(--ink)}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:11px 2px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.seg input:checked+span{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.seg button{margin:0;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.seg button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it b{font-weight:600}.mut{color:var(--mut);font-size:14px}
.n{font-weight:800;font-size:20px}.low{color:var(--out)}.in{color:var(--in)}.cr{color:var(--cr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.k .n{display:block;margin-top:2px}
.big{font-size:30px;font-weight:800;display:block}
.toast{background:var(--in);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:15px}
.toast.err{background:var(--out)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:400;border-top:0}
.pr{width:96px;flex:none;padding:11px 8px;text-align:right}
.sm{width:auto;margin:0;padding:8px 12px;font-size:14px;background:transparent;color:var(--out);border:1px solid var(--out)}
.doc{background:#fff;color-scheme:light;--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#9AA5A0;color:#000}
.doc h3{font-size:15px;font-weight:600;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.dt{font-size:20px;font-weight:800;letter-spacing:.02em}
.tl th,.tl td{text-align:left}.tl th:last-child,.tl td:last-child{text-align:right}
tr.tt td{font-weight:800;border-top:2px solid var(--ink)}
.chk{display:flex;align-items:center;gap:10px;margin:0;padding:9px 0;border-top:1px solid var(--line);color:var(--ink);font-size:16px}
.chk input{width:20px;height:20px;flex:none;padding:0}
.sig{display:flex;gap:28px;margin-top:40px}.sig div{flex:1;border-top:1px solid var(--ink);padding-top:4px;font-size:13px;color:var(--mut);text-align:center}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}main{max-width:none;padding:0}.card{border:0;padding:0}.mut{color:#333}}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;border:2px solid var(--ink);border-radius:6px;padding:12px;margin-bottom:6px}
.dh .dt{font-size:18px}.bz{font-size:14px;color:var(--mut)}
.kb{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin-top:4px}
.kb>div{padding:8px 10px;border:1px solid var(--line);display:flex;flex-direction:column}
.kb>.w2{grid-column:1/-1;background:#fff}.kb b{font-size:18px}
.doc table{border:1px solid var(--ink)}
.doc th,.doc td{border:1px solid var(--line)}
.doc th{background:#fff;color:#000;font-weight:700;border-bottom:2px solid #000}
.tm th,.tm td{text-align:left}.tm th:nth-child(n+3):nth-child(-n+5),.tm td:nth-child(n+3):nth-child(-n+5){text-align:right}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.wm{position:relative;overflow:hidden}
.wm::before{content:"";position:absolute;inset:0;background:var(--logo) center 45%/80% no-repeat;opacity:.1;pointer-events:none}
.wm>*{position:relative}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border-radius:0;background:transparent;color:var(--mut);padding:14px 2px;font-size:13px}
button.home{display:block;text-align:left;margin:0 0 12px;padding:18px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--in);border-radius:14px}
button.home.cg{border-left-color:var(--out)}
button.home.gn{border-left-color:var(--cr)}
button.home.mt{border-left-color:#8b5cf6}
button.home.kg{border-left-color:#f59e0b}
.tk3 th,.tk3 td{text-align:left}.tk3 th:last-child,.tk3 td:last-child{text-align:right}
.tk th,.tk td,.tk5 th,.tk5 td{text-align:left}.tk th:last-child,.tk td:last-child,.tk5 th:last-child,.tk5 td:last-child{text-align:right}
.tg th,.tg td{text-align:left}.tg th:nth-child(n+3),.tg td:nth-child(n+3){text-align:right}
.tg7 th,.tg7 td{text-align:left}.tg7 th:nth-child(4),.tg7 td:nth-child(4),.tg7 th:nth-child(n+6),.tg7 td:nth-child(n+6){text-align:right}
.tgu th,.tgu td{text-align:left}.tgu th:nth-child(3),.tgu td:nth-child(3),.tgu th:nth-child(n+5),.tgu td:nth-child(n+5){text-align:right}
.tg6 th,.tg6 td{text-align:left}.tg6 th:nth-child(n+4),.tg6 td:nth-child(n+4){text-align:right}
button.home b{display:block;font-size:20px;font-weight:800}
button.home span{display:block;margin-top:4px;font-size:14px;font-weight:400;color:var(--mut)}
nav button[aria-current=true]{color:var(--ink);box-shadow:inset 0 3px 0 var(--in)}
</style></head><body>
<header id="hdr"></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
var $=s=>document.querySelector(s);
var LSOK=false;try{localStorage.setItem('__t','1');localStorage.removeItem('__t');LSOK=true}catch(e){}
var S={products:[],moves:[]};
try{var r=JSON.parse(localStorage.getItem('inv')||'null');if(r&&r.products)S=r}catch(e){}
function save(){try{localStorage.setItem('inv',JSON.stringify(S))}catch(e){}}
var bs=n=>'Bs '+(+n).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
var esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
var day=t=>{var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var fd=t=>{var d=new Date(t);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2)};
var TODAY=day(Date.now()),tab='home',mt='out',kp='',dsel=TODAY,msel=TODAY.slice(0,7),msg=null;
var HOY=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
var stock=id=>S.moves.reduce((a,m)=>m.pid===id?a+(m.type==='in'?m.qty:-m.qty):a,0);
var prod=id=>S.products.find(p=>p.id===id);
var tstamp=d=>d===TODAY?Date.now():new Date(d+'T12:00:00').getTime();
function say(t,err){msg={t:t,err:err};render()}
function opts(){return S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' ('+stock(p.id)+' disp. · '+bs(p.price)+')</option>').join('')}
function empty(){return '<div class="card mut">Primero agrega un producto en la pestaña Productos.</div>'}

function addProd(){
  var n=$('#pn').value.trim(),pr=parseFloat($('#pp').value),q=parseInt($('#pq').value)||0;
  if(!n||!(pr>=0)||$('#pp').value==='')return say('Escribe el nombre y el precio en Bs.',1);
  var id=Date.now().toString(36);S.products.push({id:id,name:n,price:pr});
  if(q>0)S.moves.push({t:Date.now(),pid:id,type:'in',qty:q});
  save();say('Producto agregado: '+n);
}
var dc=null;
function setName(id,v){var p=prod(id);v=v.trim();if(p&&v){p.name=v;save()}}
function delProd(id){if(dc!==id){dc=id;return render()}dc=null;S.products=S.products.filter(p=>p.id!==id);S.moves=S.moves.filter(m=>m.pid!==id);save();say('Producto eliminado.')}
function delMov(i){var k='m'+i;if(dc!==k){dc=k;return render()}dc=null;ed=null;S.moves.splice(i,1);save();say('Movimiento anulado. El saldo se recalculó.')}
function setPrice(id,v){var p=prod(id),x=parseFloat(v);if(p&&x>=0){p.price=x;save()}}
var ed=null;
function editMov(i){ed=i;dc=null;msg=null;render();scrollTo(0,0)}
function cancelEd(){ed=null;render()}
function fillEd(){
  var m=S.moves[ed];if(!m){ed=null;return}
  $('#md').value=day(m.t);$('#mp').value=m.pid;$('#mq').value=m.qty;$('#mst').value=isCanc(m)?'1':'0';$('#mfp').value=isCanc(m)?fpay(m):'';
  if(m.type==='out'){$('#mpr').value=m.price!=null?m.price:'';var r=document.querySelector('input[name=pay][value='+(m.pay||'contado')+']');if(r)r.checked=true;$('#mc').value=m.client||'';$('#mdest').value=m.dest||''}
  else{$('#mprov').value=m.prov||'';$('#mcost').value=m.cost||''}
  $('#mpaid').value=paidM(m)>0?paidM(m):'';
}
function setPr(){var e=$('#mpr'),p=prod($('#mp').value);if(e&&p&&ed===null)e.value=p.price}
function addMov(){
  var id=$('#mp').value,q=parseInt($('#mq').value),d=$('#md').value||TODAY,old=ed!==null?S.moves[ed]:null;
  if(!id)return say('Primero agrega un producto.',1);
  if(!(q>0))return say('Escribe una cantidad mayor a 0.',1);
  var t=old&&day(old.t)===d?old.t:tstamp(d),mv;
  if(mt==='in'){var co=parseFloat($('#mcost').value);if(!(co>=0))co=0;mv={t:t,pid:id,type:'in',qty:q,prov:$('#mprov').value.trim(),cost:co}}
  else{
    var pay=document.querySelector('input[name=pay]:checked').value,cl=$('#mc').value.trim(),dest=$('#mdest').value.trim();
    var pr=parseFloat($('#mpr').value);if(!(pr>=0))return say('Escribe el precio de venta en Bs.',1);
    if(pay==='credito'&&!cl)return say('Escribe el nombre del cliente para la venta a crédito.',1);
    mv={t:t,pid:id,type:'out',qty:q,price:pr,pay:pay,client:cl,dest:dest};
  }
  var tt=totM(mv),pi=$('#mpaid').value.trim(),pd=pi===''?($('#mst').value==='1'?tt:0):parseFloat(pi);
  if(!(pd>=0))return say('El monto cancelado no es válido.',1);
  if(pd>tt+0.004)return say('El monto cancelado no puede ser mayor al total ('+bs(tt)+').',1);
  var st=tt>0?pd>=tt-0.004:$('#mst').value==='1';mv.paid=st&&tt>0?tt:pd;mv.canc=st;mv.fpago=(st||pd>0)?($('#mfp').value||TODAY):'';
  if(old)S.moves[ed]=mv;else S.moves.push(mv);
  if([id,old&&old.pid].some(x=>x&&stock(x)<0)){
    if(old)S.moves[ed]=old;else S.moves.pop();
    return say(mt==='out'&&!old?'No alcanza: solo quedan '+stock(id)+'.':'Con ese cambio el saldo quedaría en negativo.',1);
  }
  save();ed=null;
  say(old?'Movimiento actualizado.':mt==='in'?'Ingreso registrado: +'+q:'Salida registrada'+(mv.pay==='ninguno'?' (sin forma de pago)':': '+bs(q*mv.price)+' ('+(mv.pay==='credito'?'crédito':mv.pay==='intercambio'?'intercambio':mv.pay==='reproas'?'reproas':'contado')+')'));
}
var excl={};
var fh=t=>new Date(t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
var fdl=k=>k.split('-').reverse().join('/');
function perLabel(mes,pre){var a=pre.split('-');return mes?new Date(a[0],a[1]-1,1).toLocaleDateString('es',{month:'long',year:'numeric'}):a[2]+'/'+a[1]+'/'+a[0]}
function who(m){return [m.client,m.dest].filter(Boolean).join(' → ')||'—'}
function pick(v,mes){if(!v)return;if(mes)msel=v;else dsel=v;excl={};render()}
function togP(id){if(excl[id])delete excl[id];else excl[id]=1;render()}
function togAll(on){stat(tab==='mes'?msel:dsel).sold.forEach(id=>{if(on)delete excl[id];else excl[id]=1});render()}
function doPrint(){try{window.print()}catch(e){say('No se pudo abrir la impresión. Usa Copiar reporte.',1)}}
function stat(pre){
  var all=S.moves.filter(m=>day(m.t).indexOf(pre)===0),sold=[];
  all.forEach(m=>{if(m.type==='out'&&sold.indexOf(m.pid)<0&&prod(m.pid))sold.push(m.pid)});
  var ms=all.filter(m=>!excl[m.pid]),out=ms.filter(m=>m.type==='out'&&prod(m.pid)),per={},tot=0,con=0,cre=0,tru=0,rpr=0,pen=0,u=0,dias={};
  out.forEach(m=>{var v=val(m);tot+=v;u+=m.qty;if(!isCanc(m))pen+=v;m.pay==='credito'?cre+=v:m.pay==='intercambio'?tru+=v:m.pay==='reproas'?rpr+=v:con+=v;var o=per[m.pid]=per[m.pid]||{p:prod(m.pid),u:0,v:0};o.u+=m.qty;o.v+=v;var k=day(m.t);dias[k]=dias[k]||{n:0,v:0};dias[k].n++;dias[k].v+=v});
  var rank=Object.keys(per).map(k=>per[k]).sort((a,b)=>b.u-a.u);
  var ent=ms.filter(m=>m.type==='in').reduce((a,m)=>a+m.qty,0);
  return{sold:sold,out:out,tot:tot,con:con,cre:cre,tru:tru,rpr:rpr,pen:pen,u:u,rank:rank,ent:ent,dias:dias,n:out.length,ins:ms.filter(m=>m.type==='in'&&prod(m.pid)).sort((a,b)=>a.t-b.t)};
}
function sendRep(mes){
  var pre=mes?msel:dsel,s=stat(pre),
  L=[mes?'REPORTE MENSUAL DE VENTAS':'REPORTE DIARIO DE VENTAS','Período: '+perLabel(mes,pre),'Emitido: '+new Date().toLocaleString('es'),'','1. RESUMEN','Total de ventas: '+bs(s.tot),'   Al contado: '+bs(s.con),'   A crédito: '+bs(s.cre),'   Por intercambio: '+bs(s.tru),'   Reproas: '+bs(s.rpr),'Transacciones: '+s.n,'Unidades vendidas: '+s.u,'Unidades ingresadas: '+s.ent,'','2. PRODUCTOS VENDIDOS'];
  s.rank.forEach(r=>L.push('- '+r.p.name+': '+r.u+' u. = '+bs(r.v)));
  if(s.u){var lo=s.rank[s.rank.length-1];L.push('','Más vendido: '+s.rank[0].p.name+' ('+s.rank[0].u+' u.)','Menos vendido: '+lo.p.name+' ('+lo.u+' u.)')}
  if(mes){L.push('','3. VENTA POR DÍA');Object.keys(s.dias).sort().forEach(k=>L.push(fdl(k)+': '+bs(s.dias[k].v)+' ('+s.dias[k].n+' ventas)'))}
  var det=s.out.slice().sort((a,b)=>a.t-b.t);
  if(det.length)L.push('',mes?'4. DETALLE DE VENTAS':'3. DETALLE DE VENTAS');
  det.forEach(m=>L.push((mes?fd(m.t):fh(m.t))+' | '+m.qty+' x '+prod(m.pid).name+' | '+payL(m)+(stTxt(m)?' ('+stTxt(m)+')':'')+' | '+who(m)+' | '+imp(m)));
  L.push('','TOTAL: '+bs(s.tot),'','Elaborado por: ____________   Revisado por: ____________');
  send(L.join('\n'),mes?'Reporte mensual':'Reporte diario');
}
function vRep(mes){
  var pre=mes?msel:dsel,s=stat(pre),h='<div class="card noprint"><h2>'+(mes?'Reporte mensual':'Reporte diario')+'</h2><input type="'+(mes?'month':'date')+'" value="'+pre+'" aria-label="Período" onchange="pick(this.value,'+mes+')">';
  if(!s.sold.length)return h+'</div><div class="card mut">No hay ventas en este período.</div>';
  h+='<div class="it" style="margin-top:10px"><b>Productos a incluir</b><span style="display:flex;gap:6px"><button class="sm" style="color:var(--ink);border-color:var(--line)" onclick="togAll(1)">Todos</button><button class="sm" style="color:var(--ink);border-color:var(--line)" onclick="togAll(0)">Ninguno</button></span></div>';
  s.sold.forEach(id=>{h+='<label class="chk"><input type="checkbox" '+(excl[id]?'':'checked')+' onchange="togP(\''+id+'\')"><span>'+esc(prod(id).name)+'</span></label>'});
  h+=actions('pdfRep('+mes+')')+'</div>';
  if(!s.u)return h+'<div class="card mut">Selecciona al menos un producto.</div>';
  var lo=s.rank[s.rank.length-1];
  h+='<div class="card doc">'+dHead(mes?'REPORTE MENSUAL DE VENTAS':'REPORTE DIARIO DE VENTAS','Período: '+perLabel(mes,pre))+
  '<h3>1. Resumen</h3><div class="kb">'+[['Total de ventas',bs(s.tot),1],['Ventas al contado',bs(s.con)],['Ventas a crédito',bs(s.cre)],['Por intercambio',bs(s.tru)],['Reproas',bs(s.rpr)],['Pendiente de cobro',bs(s.pen)],['Transacciones',s.n],['Unidades vendidas',s.u],['Unidades ingresadas',s.ent]].map(r=>'<div class="'+(r[2]?'w2':'')+'"><span class="mut">'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')+'</div>'+
  '<h3>2. Productos vendidos</h3><div class="tw"><table><tr><th>Producto</th><th>Cant.</th><th>P. prom.</th><th>Importe</th></tr>'+s.rank.map(r=>'<tr><td>'+esc(r.p.name)+'</td><td>'+r.u+'</td><td>'+bs(r.v/r.u)+'</td><td>'+bs(r.v)+'</td></tr>').join('')+'<tr class="tt"><td>Total</td><td>'+s.u+'</td><td></td><td>'+bs(s.tot)+'</td></tr></table></div>'+
  '<div class="mut" style="margin-top:8px">Más vendido: <b>'+esc(s.rank[0].p.name)+'</b> ('+s.rank[0].u+' u.) · Menos vendido: <b>'+esc(lo.p.name)+'</b> ('+lo.u+' u.)</div>';
  if(mes){
    h+='<h3>3. Venta por día</h3><table><tr><th>Fecha</th><th>Ventas</th><th>Importe</th></tr>'+Object.keys(s.dias).sort().map(k=>'<tr><td>'+fdl(k)+'</td><td>'+s.dias[k].n+'</td><td>'+bs(s.dias[k].v)+'</td></tr>').join('')+'<tr class="tt"><td>Total</td><td>'+s.n+'</td><td>'+bs(s.tot)+'</td></tr></table>';
    h+=hOut(s.out.slice().sort((a,b)=>a.t-b.t),4)+hIn(s.ins,5);
  }else{
    h+='<h3>3. Detalle de ventas</h3><div class="tw"><table class="tl"><tr><th>Hora</th><th>Producto</th><th>Cant.</th><th>Cliente / destino</th><th>Pago</th><th>Estado</th><th>F. pago</th><th>Importe</th></tr>'+s.out.slice().sort((a,b)=>a.t-b.t).map(m=>'<tr><td>'+fh(m.t)+'</td><td>'+esc(prod(m.pid).name)+'</td><td>'+m.qty+'</td><td>'+esc(who(m))+'</td><td>'+payL(m)+'</td><td>'+estL(m)+'</td><td>'+fpL(m)+'</td><td>'+imp(m)+'</td></tr>').join('')+'</table></div>';

var imp=m=>m.pay==='ninguno'?'-':bs(m.qty*m.price);

  '<div class="card noprint"><h2>'+(E?'Editar registro':'Agregar fila')+'</h2><div class="row"><div><label for="kd">Fecha de trabajo</label><input id="kd" type="date" value="'+(E?E.d:(koD!=='*'&&koD?koD:(last&&last.d)||TODAY))+'"></div><div><label for="kp">Predio ganadero</label><input id="kp" list="dkp" autocomplete="off" value="'+esc(E?E.p||'':(last?last.p||'':''))+'">'+dl('dkp',ps)+'</div></div>'+
  '<label for="ko">Nombre del productor</label><input id="ko" list="dko" autocomplete="off" value="'+esc(E?E.o:(last?last.o:''))+'">'+dl('dko',os)+
  '<label for="kc">Categoría</label><input id="kc" list="dkc" autocomplete="off" placeholder="Vacas, toros, terneros…" value="'+(E?esc(E.c):'')+'">'+dl('dkc',cs)+
  '<div class="row"><div><label for="ke">Edad del ganado</label><input id="ke" list="dke" autocomplete="off" placeholder="Ej.: 2 años" value="'+(E?esc(E.e||''):'')+'">'+dl('dke',es)+'</div><div><label for="kn">Cantidad</label><input id="kn" type="number" inputmode="numeric" min="1" step="1" value="'+(E?E.n:'')+'"></div></div>'+
  '<button onclick="addKo()">'+(E?'Guardar cambios':'Agregar fila')+'</button>'+(E?'<button onclick="cancelKo()" style="background:transparent;color:var(--ink);border:1px solid var(--line)">Cancelar</button>':'')+'<div class="mut" style="margin-top:6px">Agrega una fila por cada productor y categoría. El productor y la fecha quedan listos para la siguiente fila.</div></div>';
  if(!A.length)return h+'<div class="card mut">No hay registros'+(koD==='*'?' todavía':' en esta fecha')+'.</div>';
  var T=koTot(A);
  return h+'<div class="card noprint">'+actions('pdfKo()')+'</div><div class="card doc wm">'+dHead('CONTADOR DE GANADO',koD==='*'?'Todas las fechas':'Fecha de trabajo: '+koF(koD))+'<div class="mut">Contador: '+esc(koCur().name)+'</div>'+
  '<div class="kb"><div class="w2"><span class="mut">Total de cabezas</span><b>'+T+'</b></div></div>'+
  '<div class="tw"><table class="tk5"><tr><th>Fecha de trabajo</th><th>Predio ganadero</th><th>Nombre del productor</th><th>Categoría</th><th>Edad del ganado</th><th>Cantidad</th></tr>'+
  A.map(x=>'<tr><td style="white-space:nowrap">'+koF(x.d)+'</td><td>'+esc(x.p||'-')+'</td><td>'+esc(x.o)+'<div class="noprint" style="display:flex;gap:6px;margin-top:6px"><button class="sm" style="color:var(--ink);border-color:var(--line)" onclick="editKo('+x.ix+')">Editar</button><button class="sm" onclick="delKo('+x.ix+')">'+(dc==='k'+x.ix?'¿Seguro? Toca otra vez':'Eliminar')+'</button></div></td><td>'+esc(x.c)+'</td><td>'+esc(x.e||'-')+'</td><td style="text-align:right"><b>'+x.n+'</b><div class="noprint" style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="sm" style="min-width:44px;font-size:18px;font-weight:700;color:var(--ink);border-color:var(--line)" onclick="adjKo('+x.ix+',-1)" aria-label="Restar uno">−</button><button class="sm" style="min-width:44px;font-size:18px;font-weight:700;color:var(--ink);border-color:var(--line)" onclick="adjKo('+x.ix+',1)" aria-label="Sumar uno">+</button></div></td></tr>').join('')+
  '<tr class="tt"><td>Total</td><td></td><td></td><td></td><td></td><td>'+T+'</td></tr></table></div>'+
  koSum(koGrp(A,x=>x.o),'Resumen por productor','Productor')+koSumCE(A)+sigs()+'</div>';
}
function pdfKo(){var P=P_();if(!P)return say('No se pudo generar el PDF aquí. Usa Imprimir.',1);var A=koAll();if(!A.length)return say('No hay ganado para el reporte.',1);pWM(P);
  var T=koTot(A);pHead(P,'CONTADOR DE GANADO',koD==='*'?'Todas las fechas':'Fecha de trabajo: '+koF(koD));pNote(P,'Contador: '+koCur().name);pBoxes(P,[['Total de cabezas',String(T),1]]);
  pTable(P,[{h:'Fecha de trabajo',w:24},{h:'Predio ganadero',w:34},{h:'Productor',w:44},{h:'Categoría',w:30},{h:'Edad',w:28},{h:'Cantidad',w:22,a:'r'}],A.map(x=>[koF(x.d),x.p||'-',x.o,x.c,x.e||'-',x.n]),['Total','','','','',T]);
  pSec(P,'Resumen por productor');pTable(P,[{h:'Productor',w:130},{h:'Total',w:52,a:'r'}],koGrp(A,x=>x.o).map(g=>[g.l,g.tot]),['Total',T]);
  pSec(P,'Resumen por categoría');pTable(P,[{h:'Categoría',w:80},{h:'Edad del ganado',w:62},{h:'Total',w:40,a:'r'}],koCE(A).map(g=>[g.c,g.e||'-',g.n]),['Total','',T]);
  pSig(P);pOut(P,'Contador-de-ganado-'+TODAY+'.pdf','Contador de ganado')}
var bkTxt='',rsPend=null,taSt='width:100%;box-sizing:border-box;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px',ghSt='background:transparent;color:var(--ink);border:1px solid var(--line)';
async function backupSave(){var data=JSON.stringify({app:'grupo-pecuario',v:1,fecha:new Date().toISOString(),datos:S}),name='copia-grupo-pecuario-'+TODAY+'.json';
  try{var dl=window.claude&&claude.use?await claude.use('downloads'):null;if(!dl){bkTxt=data;return render()}
    await dl.save({filename:name,data:data});S.lastBackup=TODAY;save();say('Copia de seguridad guardada.')}
  catch(e){if(e&&e.code==='declined')return say('Copia cancelada.',1);bkTxt=data;render()}}
function copyBk(){var t=$('#bkta');if(t)t.select();try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(bkTxt).then(()=>say('Texto copiado.'),()=>say('Selecciona el texto y cópialo manualmente.',1));else{document.execCommand('copy');say('Texto copiado.')}}catch(e){say('Selecciona el texto y cópialo manualmente.',1)}}
function restoreFile(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=()=>prepRestore(String(r.result));r.onerror=()=>say('No se pudo leer el archivo.',1);r.readAsText(f);inp.value=''}
function prepRestore(txt){var j;try{j=JSON.parse(txt)}catch(e){return say('El texto o archivo no es una copia válida.',1)}
  var d=j&&j.datos?j.datos:j;if(!d||!Array.isArray(d.products)||!Array.isArray(d.moves))return say('No parece una copia de este sistema.',1);
  rsPend={d:d,f:j.fecha||''};render();scrollTo(0,0)}
function confirmRestore(){if(!rsPend)return;S=rsPend.d;rsPend=null;bkTxt='';save();say('Datos restaurados correctamente.')}
function cancelRestore(){rsPend=null;render()}
function vBk(){
  var h='',old=!S.lastBackup||(Date.now()-new Date(S.lastBackup+'T00:00:00').getTime())>7*864e5;
  if(rsPend){var d=rsPend.d;h+='<div class="card"><h2>¿Restaurar esta copia?</h2><div class="mut">'+(rsPend.f?'Copia del '+new Date(rsPend.f).toLocaleString('es',{dateStyle:'short',timeStyle:'short'})+'. ':'')+'Productos: '+d.products.length+' · Movimientos: '+d.moves.length+'. Se reemplazarán TODOS los datos actuales de este navegador.</div><button onclick="confirmRestore()">Sí, restaurar</button><button onclick="cancelRestore()" style="'+ghSt+'">Cancelar</button></div>'}
  if(bkTxt)h+='<div class="card"><h2>Copia en texto</h2><div class="mut">No se pudo guardar el archivo. Copia este texto y guárdalo en un lugar seguro (notas, WhatsApp).</div><textarea id="bkta" readonly rows="6" style="'+taSt+'">'+esc(bkTxt)+'</textarea><button onclick="copyBk()">Copiar texto</button><button onclick="bkTxt=\'\';render()" style="'+ghSt+'">Cerrar</button></div>';
  h+='<div class="card"><h2>Copia de seguridad</h2><div class="mut">'+(S.lastBackup?'Última copia: '+fdl(S.lastBackup)+'.':'Aún no has guardado ninguna copia.')+' Tus datos se guardan solo en este navegador; con una copia puedes recuperarlos si se borran.</div>'+
  (!LSOK?'<div style="color:var(--out);margin:8px 0"><b>Este navegador no permite guardar datos: lo que registres se perderá al cerrar. Guarda copias seguido.</b></div>':old?'<div style="color:var(--out);margin:8px 0"><b>Te recomiendo guardar una copia ahora.</b></div>':'')+
  '<button onclick="backupSave()">Guardar copia de seguridad</button><button onclick="$(\'#rst\').click()" style="'+ghSt+'">Restaurar copia</button><input type="file" id="rst" accept=".json,application/json" style="display:none" onchange="restoreFile(this)">'+
  '<details style="margin-top:10px"><summary class="mut">Restaurar pegando el texto</summary><textarea id="rpaste" rows="4" style="'+taSt+'" placeholder="Pega aquí la copia"></textarea><button onclick="prepRestore($(\'#rpaste\').value)">Revisar copia</button></details></div>';
  return h}
var V={home:vHome,cargo:vCargo,gan:vGan,invsel:vInvSel,meta:vMeta,cont:vCont};
var TABS=[['prod','Productos',vProd],['mov','Movimiento',vMov],['kar','Kardex',vKar],['cob','Cobrar',()=>vAcc('c')],['pag','Pagar',()=>vAcc('p')],['dia','Día',()=>vRep(false)],['mes','Mes',()=>vRep(true)]];
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TODAY!==day(Date.now()))render()});
function render(){
  TODAY=day(Date.now());
  var inv=!V[tab],fn=V[tab]||TABS.find(x=>x[0]===tab)[2],ttl=tab==='home'?biz():tab==='cargo'?'Cargo a rendir':tab==='gan'?'Control de predios ganaderos':tab==='invsel'?'Inventarios':tab==='meta'?'Barra de metas diarias':tab==='cont'?'Contador de ganado':'Control de inventario';
  $('#hdr').innerHTML=(tab!=='home'?'<button class="sm noprint" style="color:var(--ink);border-color:var(--line);margin:0 0 8px" onclick="go(\'home\')">← Inicio</button>':'')+(inv?'<button class="sm noprint" style="color:var(--ink);border-color:var(--line);margin:0 0 8px 8px" onclick="go(\'invsel\')">Inventarios</button>':'')+'<h1>'+esc(ttl)+'<small>'+(inv?esc(invName())+' · ':'')+HOY+'</small></h1>';
  $('#main').innerHTML=(msg?'<div class="toast'+(msg.err?' err':'')+'" role="status">'+esc(msg.t)+'</div>':'')+fn();
  $('#nav').style.display=inv?'flex':'none';
  $('#nav').innerHTML=TABS.map(x=>'<button onclick="go(\''+x[0]+'\')" aria-current="'+(x[0]===tab)+'">'+x[1]+'</button>').join('');
  if(tab==='mov'&&ed!==null)fillEd();else if(tab==='mov')setPr();
  msg=null;
}
function go(t){tab=t;msg=null;dc=null;ed=null;ce=null;cv=null;ee=null;ev=null;gv='env';te=null;tdSel=day(Date.now());koE=null;koD='*';render();scrollTo(0,0)}
render();
